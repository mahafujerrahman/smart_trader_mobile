name: smart_trader_mobile
description: "Smart Trader Mobile - Professional Trading App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6

  # Navigation
  go_router: ^14.6.3

  # Network & Data
  http: ^1.6.0
  xml: ^6.5.0

  # Storage
  shared_preferences: ^2.5.6

  # UI
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.3
  logger: ^2.8.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/language/
